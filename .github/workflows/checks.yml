name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pipes:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check main.py pipes_problem
      - name: Test
        run: uv run python -m unittest discover -s pipes_problem -t .
