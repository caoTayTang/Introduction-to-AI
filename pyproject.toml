[project]
name = "ai-search-puzzles"
version = "0.1.0"
description = "Introduction to AI: visual search algorithms for logic puzzles"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame-ce>=2.5.8,<3",
    "pygame-gui>=0.6.14,<0.7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
